name: Build Product Book APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Product_Book_Android_Ready.zip -d productbook
          ls -la productbook

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > productbook/gradle.properties

      - name: Fix Kotlin dependency conflict
        working-directory: productbook
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
          }
          EOF

      - name: Build APK
        working-directory: productbook
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Product-Book-APK
          path: productbook/app/build/outputs/apk/debug/app-debug.apk
